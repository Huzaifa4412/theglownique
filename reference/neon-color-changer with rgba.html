<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Sign Color Changer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 2rem 1rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 20px;
      padding: 2rem;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }

    .canvas-wrap {
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.75rem;
      position: relative;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    #cnvOver {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
    }

    .controls-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 1rem;
      text-align: center;
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .swatch-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      outline: none;
      position: relative;
    }

    .swatch::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: border-color 0.2s ease;
    }

    .swatch:hover { transform: scale(1.15); }

    .swatch.active {
      transform: scale(1.2);
      box-shadow: 0 0 16px var(--glow, rgba(255,255,255,0.4));
    }

    .swatch.active::after { border-color: rgba(255,255,255,0.5); }

    .swatch-name {
      font-size: 10px;
      color: #555;
      text-align: center;
      transition: color 0.2s;
    }

    .swatch:hover + .swatch-name,
    .swatch.active + .swatch-name { color: #ccc; }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .active-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transition: background 0.3s ease, box-shadow 0.3s ease;
      background: rgba(255,244,214,0.65);
    }

    .active-color-label {
      font-size: 13px;
      color: #666;
    }

    .active-color-label span {
      color: #ddd;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="canvas-wrap">
      <canvas id="cnv"></canvas>
      <canvas id="cnvOver"></canvas>
    </div>
    <p class="controls-label">Choose neon color</p>
    <div class="swatches" id="swatches"></div>
    <div class="status-bar">
      <div class="active-dot" id="activeDot"></div>
      <div class="active-color-label">Active: <span id="activeLabel">Warm White</span></div>
    </div>
  </div>

    // ─── Build swatches ───────────────────────────────────────────────────────
    COLORS.forEach(function(color, i) {
      var wrap = document.createElement("div");
      wrap.className = "swatch-wrap";

      var btn = document.createElement("button");
      btn.className = "swatch" + (i === 0 ? " active" : "");
      btn.style.background = color.style;
      btn.style.setProperty("--glow", color.glow);
      btn.setAttribute("aria-label", color.name);

      if (i === 0) {
        activeBtn = btn;
        activeDot.style.background = color.glow;
        activeDot.style.boxShadow = "0 0 8px " + color.glow;
      }

      btn.addEventListener("click", function() {
        if (activeBtn === btn) return;
        if (activeBtn) activeBtn.classList.remove("active");
        btn.classList.add("active");
        activeBtn = btn;
        activeColor = color;
        activeLabel.textContent = color.name;

        activeDot.style.background = color.glow || "#888";
        activeDot.style.boxShadow = "0 0 8px " + (color.glow || "#888");
        crossfadeTo(color);
      });

      var nameEl = document.createElement("div");
      nameEl.className = "swatch-name";
      nameEl.textContent = color.name;

      wrap.appendChild(btn);
      wrap.appendChild(nameEl);
      swatchesEl.appendChild(wrap);
    });

    // ─── Recolor pixels ───────────────────────────────────────────────────────
    function buildColoredFrame(color) {
      var imageData = ctxMain.createImageData(cnv.width, cnv.height);
      var d = imageData.data;

      if (color.r === null) {
        for (var j = 0; j < originalPixels.length; j++) d[j] = originalPixels[j];
        return imageData;
      }

      var tR = color.r, tG = color.g, tB = color.b;

      for (var i = 0; i < d.length; i += 4) {
        var oR  = originalPixels[i];
        var oG  = originalPixels[i + 1];
        var oB  = originalPixels[i + 2];
        var lum = 0.299 * oR + 0.587 * oG + 0.114 * oB;

        if (lum >= THRESHOLD) {
          var t     = Math.min((lum - THRESHOLD) / (255 - THRESHOLD), 1);
          var scale = lum / 255;
          d[i]     = Math.round(scale * tR * t + oR * (1 - t));
          d[i + 1] = Math.round(scale * tG * t + oG * (1 - t));
          d[i + 2] = Math.round(scale * tB * t + oB * (1 - t));
        } else {
          d[i] = oR; d[i + 1] = oG; d[i + 2] = oB;
        }
        d[i + 3] = originalPixels[i + 3];
      }
      return imageData;
    }

    // ─── Crossfade transition ─────────────────────────────────────────────────
    function crossfadeTo(color) {
      if (!originalPixels) return;
      if (animFrame) cancelAnimationFrame(animFrame);

      var newFrame = buildColoredFrame(color);
      ctxOver.putImageData(newFrame, 0, 0);

      var start = performance.now();

      function tick(now) {
        var elapsed  = now - start;
        var progress = Math.min(elapsed / TRANSIT_MS, 1);
        var ease = progress < 0.5
          ? 4 * progress * progress * progress
          : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        cnvOver.style.opacity = ease;

        if (progress < 1) {
          animFrame = requestAnimationFrame(tick);
        } else {
          ctxMain.putImageData(newFrame, 0, 0);
          cnvOver.style.opacity = 0;
          animFrame = null;
        }
      }

      animFrame = requestAnimationFrame(tick);
    }

  </script>
</body>
</html>
